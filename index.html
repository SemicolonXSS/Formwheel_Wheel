<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FormWheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --bg: #f5f6fa;
    --card: #242338;
    --card-border: #34314F;
    --ink: #F0EDE4;
    --muted: #A8A3C0;
    --gold: #E8B86D;
    --gold-ink: #241A08;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 40px 20px 60px;
    transition: background 0.3s ease;
  }
  .wa-wrap { max-width: 880px; margin: 0 auto; }
  .wa-authbar { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .wa-authbar-email { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .wa-authbar .wa-icon-btn { border: 1px solid var(--card-border); }
  .wa-lang-select { background: var(--card); color: var(--ink); border: 1px solid var(--card-border); border-radius: 8px; padding: 5px 8px; font-size: 12px; cursor: pointer; }
  .fw-home-logo { display:flex; align-items:center; gap:7px; text-decoration:none; color:inherit; width:max-content; }
  .fw-form { color:#2867e8; font-size:24px; font-weight:800; letter-spacing:-1px; }
  .fw-wheel { color:#666; font-size:24px; font-weight:800; letter-spacing:-1px; }
  .fw-wheel-icon { width:27px; height:27px; border:4px solid #2867e8; border-radius:50%; position:relative; display:inline-block; }
  .fw-wheel-icon::before { content:""; position:absolute; width:7px; height:3px; background:#2867e8; border-radius:3px; left:50%; top:50%; transform:translate(-50%,-50%) rotate(45deg); }
  .fw-wheel-icon::after { content:""; position:absolute; width:5px; height:5px; background:#2867e8; border-radius:50%; left:50%; top:50%; transform:translate(-50%,-50%); }
  .fw-home-logo:hover .fw-wheel-icon { transform:rotate(12deg); }
  .fw-wheel-icon { transition:transform .2s ease; }
  .wa-brand { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .fw-home-logo { display:flex; align-items:center; gap:7px; text-decoration:none; color:inherit; width:max-content; }
  .fw-form { color:#2867e8; font-size:24px; font-weight:800; letter-spacing:-1px; }
  .fw-wheel { color:#666; font-size:24px; font-weight:800; letter-spacing:-1px; }
  .fw-wheel-icon { width:27px; height:27px; border:4px solid #2867e8; border-radius:50%; position:relative; display:inline-block; transition:transform .2s ease; }
  .fw-wheel-icon::before { content:""; position:absolute; width:7px; height:3px; background:#2867e8; border-radius:3px; left:50%; top:50%; transform:translate(-50%,-50%) rotate(45deg); }
  .fw-wheel-icon::after { content:""; position:absolute; width:5px; height:5px; background:#2867e8; border-radius:50%; left:50%; top:50%; transform:translate(-50%,-50%); }
  .fw-home-logo:hover .fw-wheel-icon { transform:rotate(12deg); }

  .wa-title { font-family: Georgia, 'Iowan Old Style', serif; font-size: 30px; margin: 0; letter-spacing: -0.01em; }
  .wa-brand-tag { font-size: 11px; color: var(--muted); border: 1px solid var(--card-border); border-radius: 999px; padding: 2px 9px; }
  .wa-sub { color: var(--muted); font-size: 14px; margin: 10px 0 32px; line-height: 1.5; }
  .wa-sub code { background: var(--card); border: 1px solid var(--card-border); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .wa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  @media (max-width: 720px) { .wa-grid { grid-template-columns: 1fr; } }
  .wa-panel { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 22px; }
  .wa-panel h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; }
  .wa-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .wa-form-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .wa-input {
    flex: 1; background: var(--bg); border: 1px solid var(--card-border); border-radius: 8px;
    padding: 9px 12px; color: var(--ink); font-size: 14px; outline: none; font-family: inherit; width: 100%;
  }
  .wa-input:focus { border-color: var(--gold); }
  .wa-input:disabled, select.wa-input:disabled { opacity: 0.5; cursor: not-allowed; }
  select.wa-input { appearance: none; cursor: pointer; }
  .wa-btn { border: none; border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .wa-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .wa-btn-primary { background: var(--gold); color: var(--gold-ink); }
  .wa-btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--card-border); }
  .wa-hint { font-size: 11px; color: var(--muted); margin: 0 0 14px; }
  .wa-lock-note { font-size: 11px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
  .wa-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
  .wa-entry { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 8px 10px; }
  .wa-entry-text { flex: 1; font-size: 13px; line-height: 1.4; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wa-entry-hidden { opacity: 0.45; }
  .wa-weight-input { flex: none !important; width: 46px; padding: 4px 6px !important; font-size: 12px !important; text-align: center; }
  .wa-color-input {
    flex: none !important; width: 30px !important; height: 30px; padding: 2px !important;
    border-radius: 7px; cursor: pointer; background: none;
  }
  .wa-color-input:disabled { cursor: not-allowed; opacity: 0.45; }
  .wa-entry-actions { display: flex; gap: 4px; }
  .wa-icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 4px 6px; border-radius: 6px; }
  .wa-icon-btn:hover { background: #2D2B47; color: var(--ink); }
  .wa-icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .wa-icon-btn:disabled:hover { background: none; color: var(--muted); }
  .wa-empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .wa-hide-checkbox { flex: none; width: 16px; height: 16px; cursor: pointer; accent-color: var(--gold); }

  .wa-settings-box { border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; margin-bottom: 14px; }
  .wa-settings-title { font-size: 11px; color: var(--muted); margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  .wa-settings-row { display: flex; gap: 10px; }
  .wa-settings-field { flex: 1; }
  .wa-settings-field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .wa-settings-field .wa-input { padding: 7px 10px; font-size: 13px; }

  .wa-wheel-col { display: flex; flex-direction: column; align-items: center; }
  .wa-wheel-holder { position: relative; width: 320px; height: 320px; margin: 10px auto 26px; max-width: 100%; }
  .wa-pointer {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
    border-top: 20px solid var(--gold); z-index: 3; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
  }
  .wa-wheel {
    width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden;
    border: 6px solid var(--card); box-shadow: 0 0 0 2px var(--card-border), 0 12px 30px rgba(0,0,0,0.4);
    will-change: transform;
    /* iOS Safarië íì íë ìì ìì SVGë¥¼ ìë¡ ê·¸ë¦¬ì§ ìê³  ë°°ê²½ìë§ ë¨ê¸°ë ë¦¬íì¸í¸ ë²ê·¸ê° ìì´ì.
       ë ì´ì´ë¥¼ ê°ì ë¡ ë¶ë¦¬í´ì ê·¸ ë²ê·¸ë¥¼ ë°©ì§í©ëë¤. */
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
  }
  .wa-wheel svg {
    display: block; width: 100%; height: 100%;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  .wa-spin-btn {
    background: var(--gold); color: var(--gold-ink); border: none; border-radius: 999px;
    padding: 13px 38px; font-size: 15px; font-weight: 700; cursor: pointer; letter-spacing: 0.01em;
  }
  .wa-spin-btn:disabled { opacity: 0.5; cursor: default; }
  .wa-winner { margin-top: 16px; text-align: center; min-height: 24px; }
  .wa-winner .wa-win-label { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .wa-winner .wa-win-text { font-family: Georgia, 'Iowan Old Style', serif; font-size: 18px; color: var(--muted); }
  .wa-footer { text-align: center; margin-top: 40px; font-size: 11px; color: var(--muted); }
  .wa-footer-notes { text-align: center; margin-top: 6px; font-size: 10px; color: var(--muted); opacity: 0.6; line-height: 1.7; }

  /* modal overlays (winner popup + confirm dialog + auth) */
  .wa-modal-overlay {
    position: fixed; inset: 0; background: rgba(10,9,20,0.72);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 24px; animation: wa-fade-in 0.25s ease;
  }
  @keyframes wa-fade-in { from { opacity: 0; } to { opacity: 1; } }
  .wa-modal-card {
    position: relative; z-index: 1002; border-radius: 20px; padding: 36px 44px;
    text-align: center; min-width: 260px; max-width: 90vw;
    animation: wa-pop-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes wa-pop-in { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .wa-modal-label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; margin-bottom: 10px; }
  .wa-modal-text { font-family: Georgia, 'Iowan Old Style', serif; font-size: 32px; font-weight: 700; margin: 0 0 8px; word-break: break-word; line-height: 1.25; }
  .wa-modal-note { font-size: 12px; opacity: 0.6; margin: 0 0 22px; }

  .wa-modal-gold { background: var(--card); border: 2px solid var(--gold); color: var(--ink); box-shadow: 0 0 60px rgba(232,184,109,0.35), 0 20px 60px rgba(0,0,0,0.5); }
  .wa-modal-gold .wa-modal-label { color: var(--gold); }

  .wa-modal-bold { background: linear-gradient(135deg, #E8B86D, #D4A5C9 55%, #7E9CD8); color: #1B1A2E; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .wa-modal-bold .wa-modal-label { color: #1B1A2E; opacity: 0.6; }
  .wa-modal-bold .wa-btn-primary { background: var(--bg); color: #F0EDE4; }

  .wa-modal-minimal { background: var(--ink); color: var(--bg); box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  .wa-modal-minimal .wa-modal-label { color: #6B6650; }
  .wa-modal-minimal .wa-btn-primary { background: var(--bg); color: var(--ink); }

  .wa-modal-neon { background: #0D0D17; border: 2px solid var(--neon-c, #39FF88); color: #EAFFF0; box-shadow: 0 0 14px var(--neon-c, #39FF88), 0 0 46px var(--neon-glow, rgba(57,255,136,0.5)), 0 20px 60px rgba(0,0,0,0.6); }
  .wa-modal-neon .wa-modal-label { color: var(--neon-c, #39FF88); text-shadow: 0 0 8px var(--neon-glow, rgba(57,255,136,0.8)); }
  .wa-modal-neon .wa-modal-text { text-shadow: 0 0 10px var(--neon-glow, rgba(57,255,136,0.5)); }
  .wa-modal-neon .wa-btn-primary { background: var(--neon-c, #39FF88); color: #06120A; }
  .wa-modal-neon .wa-btn-ghost { border-color: var(--neon-glow, rgba(57,255,136,0.4)); color: #9DF7C4; }

  /* ìí¬ë¦¿ íì (FWsecret ì½ëë¡ ì ê¸ í´ì ) */
  .wa-modal-diamond {
    background: linear-gradient(160deg, #E8F4FF 0%, #C9E6FB 40%, #9FCBEA 100%);
    color: #0B2A45; border: 2px solid #FFFFFF; position: relative; overflow: hidden;
    box-shadow: 0 0 40px rgba(255,255,255,0.6), 0 0 80px rgba(159,203,234,0.5), 0 20px 60px rgba(0,0,0,0.4);
  }
  .wa-modal-diamond::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.35) 0 2px, transparent 2px 22px),
                repeating-linear-gradient(-45deg, rgba(255,255,255,0.25) 0 2px, transparent 2px 26px);
    mix-blend-mode: screen; opacity: 0.7;
  }
  .wa-modal-diamond .wa-modal-label, .wa-modal-diamond .wa-modal-text, .wa-modal-diamond .wa-modal-actions { position: relative; z-index: 1; }
  .wa-modal-diamond .wa-modal-label { color: #2E6BA8; letter-spacing: 0.14em; }
  .wa-modal-diamond .wa-modal-text { text-shadow: 0 0 14px rgba(255,255,255,0.9); }
  .wa-modal-diamond .wa-btn-primary { background: #2E6BA8; color: #EAF6FF; }
  .wa-modal-diamond .wa-btn-ghost { border-color: rgba(46,107,168,0.35); color: #2E6BA8; }

  .wa-modal-fire {
    background: linear-gradient(180deg, #2B0A02 0%, #6E1B02 45%, #C4460A 80%, #FF8A1E 100%);
    color: #FFF3E0; border: 2px solid #FF7A1A;
    box-shadow: 0 0 50px rgba(255,122,26,0.55), 0 20px 60px rgba(0,0,0,0.6);
  }
  .wa-modal-fire .wa-modal-label { color: #FFC97A; letter-spacing: 0.12em; }
  .wa-modal-fire .wa-modal-text { text-shadow: 0 0 18px rgba(255,138,30,0.8), 0 0 6px rgba(255,255,255,0.4); }
  .wa-modal-fire .wa-btn-primary { background: #FF7A1A; color: #2B0A02; }
  .wa-modal-fire .wa-btn-ghost { border-color: rgba(255,201,122,0.4); color: #FFC97A; }

  .wa-modal-galaxy {
    background:
      radial-gradient(circle at 25% 15%, rgba(255,255,255,0.9) 0 1px, transparent 1px),
      radial-gradient(circle at 70% 40%, rgba(255,255,255,0.7) 0 1px, transparent 1px),
      radial-gradient(circle at 45% 75%, rgba(255,255,255,0.8) 0 1px, transparent 1px),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.6) 0 1px, transparent 1px),
      radial-gradient(circle at 15% 60%, rgba(255,255,255,0.5) 0 1px, transparent 1px),
      radial-gradient(ellipse at 50% 50%, #3A1C6E 0%, #1B0E3D 55%, #0A0620 100%);
    color: #EDE6FF; border: 1px solid rgba(190,150,255,0.4);
    box-shadow: 0 0 60px rgba(140,90,220,0.45), 0 20px 60px rgba(0,0,0,0.6);
  }
  .wa-modal-galaxy .wa-modal-label { color: #C7A9FF; letter-spacing: 0.16em; }
  .wa-modal-galaxy .wa-modal-text { text-shadow: 0 0 16px rgba(199,169,255,0.6); }
  .wa-modal-galaxy .wa-btn-primary { background: #C7A9FF; color: #1B0E3D; }
  .wa-modal-galaxy .wa-btn-ghost { border-color: rgba(199,169,255,0.4); color: #D8C4FF; }

  .wa-modal-retro { background: repeating-linear-gradient(45deg, #F4E9D8, #F4E9D8 10px, #EADFC8 10px, #EADFC8 20px); border: 3px double #7A5230; color: #4A2F16; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .wa-modal-retro .wa-modal-label { color: #7A5230; }
  .wa-modal-retro .wa-btn-primary { background: #7A5230; color: #F4E9D8; }
  .wa-modal-retro .wa-btn-ghost { border-color: rgba(122,82,48,0.4); color: #7A5230; }

  .wa-modal-aurora {
    background: linear-gradient(160deg, #0B1622 0%, #0F2A2E 35%, #123C34 60%, #1B2A4A 100%);
    color: #EAFBF6; box-shadow: 0 0 70px rgba(64,224,182,0.25), 0 20px 60px rgba(0,0,0,0.55);
    border: 1px solid rgba(120,255,214,0.25); position: relative; overflow: hidden;
  }
  .wa-modal-aurora::before {
    content: ""; position: absolute; inset: -40% -20%;
    background: linear-gradient(100deg, transparent 10%, rgba(88,255,196,0.25) 30%, rgba(120,170,255,0.22) 50%, transparent 75%);
    filter: blur(18px); animation: wa-aurora-shift 6s ease-in-out infinite alternate;
  }
  @keyframes wa-aurora-shift { from { transform: translateX(-6%) rotate(-3deg); } to { transform: translateX(6%) rotate(3deg); } }
  .wa-modal-aurora .wa-modal-label, .wa-modal-aurora .wa-modal-text, .wa-modal-aurora .wa-modal-actions { position: relative; z-index: 1; }
  .wa-modal-aurora .wa-modal-label { color: #7CFFCB; }
  .wa-modal-aurora .wa-modal-text { text-shadow: 0 0 18px rgba(124,255,203,0.35); }
  .wa-modal-aurora .wa-btn-primary { background: #7CFFCB; color: #06231C; }
  .wa-modal-aurora .wa-btn-ghost { border-color: rgba(124,255,203,0.35); color: #BFF7E4; }

  .wa-modal-paper {
    background: #F6EEDD;
    color: #3A3226;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    clip-path: polygon(1% 4%, 12% 0%, 30% 2%, 48% 0%, 63% 3%, 79% 0%, 94% 3%, 100% 9%, 98% 24%, 100% 40%, 97% 56%, 100% 72%, 98% 88%, 100% 96%, 88% 100%, 71% 97%, 55% 100%, 38% 98%, 21% 100%, 6% 97%, 0% 90%, 3% 74%, 0% 58%, 2% 42%, 0% 26%, 2% 12%);
    background-image:
      linear-gradient(#F6EEDD, #F6EEDD),
      repeating-linear-gradient(0deg, transparent 0 27px, rgba(58,50,38,0.06) 27px 28px);
  }
  .wa-modal-paper .wa-modal-label { color: #8A6A3B; font-family: 'Nanum Pen Script', cursive; font-size: 15px; }
  .wa-modal-paper .wa-modal-text { font-family: 'Nanum Pen Script', cursive; font-size: 40px; color: #3A3226; }
  .wa-modal-paper .wa-btn-primary { background: #8A6A3B; color: #F6EEDD; }
  .wa-modal-paper .wa-btn-ghost { border-color: rgba(58,50,38,0.3); color: #6B5A3E; }

  .wa-modal-royal {
    background: radial-gradient(circle at 30% 20%, #3B1E5E 0%, #241143 55%, #170A2E 100%);
    color: #F3E9FF; border: 2px solid #C9A544;
    box-shadow: 0 0 0 1px rgba(201,165,68,0.4), 0 0 60px rgba(123,58,196,0.4), 0 20px 60px rgba(0,0,0,0.6);
  }
  .wa-modal-royal .wa-modal-label { color: #E4C874; letter-spacing: 0.18em; }
  .wa-modal-royal .wa-modal-text { color: #FBF3E0; text-shadow: 0 0 16px rgba(228,200,116,0.4); }
  .wa-modal-royal .wa-btn-primary { background: #C9A544; color: #241143; }
  .wa-modal-royal .wa-btn-ghost { border-color: rgba(228,200,116,0.4); color: #E4C874; }

  .wa-modal-gold .wa-btn-ghost { border-color: var(--card-border); color: var(--muted); }
  .wa-modal-bold .wa-btn-ghost { border-color: rgba(27,26,46,0.35); color: #1B1A2E; }
  .wa-modal-minimal .wa-btn-ghost { border-color: rgba(27,26,46,0.3); color: var(--bg); }
  .wa-modal-actions { display: flex; gap: 10px; margin-top: 10px; }

  .wa-confirm-card { padding: 26px 30px; }
  .wa-confirm-title { font-size: 17px; font-weight: 700; margin: 0 0 8px; text-align: left; }
  .wa-confirm-body { font-size: 13px; opacity: 0.75; margin: 0 0 20px; text-align: left; }
  .wa-confirm-actions { display: flex; gap: 10px; }

  .wa-auth-field { margin-bottom: 10px; text-align: left; }
  .wa-auth-field label { display: block; font-size: 12px; opacity: 0.75; margin-bottom: 4px; }
  .wa-auth-error { font-size: 12px; color: #C0392B; margin: 0 0 12px; text-align: left; }
  .wa-auth-switch { font-size: 12px; margin-top: 14px; opacity: 0.75; }
  .wa-auth-switch button { background: none; border: none; text-decoration: underline; cursor: pointer; font-size: 12px; color: inherit; padding: 0; }
  .wa-captcha-row { display: flex; align-items: center; gap: 8px; margin: 4px 0 16px; padding: 10px 12px; border: 1px solid rgba(27,26,46,0.2); border-radius: 8px; }
  .wa-captcha-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #1B1A2E; }
  .wa-captcha-row label { font-size: 13px; cursor: pointer; }

  canvas.wa-effect-canvas { position: fixed; inset: 0; z-index: 1001; pointer-events: none; }
</style>
</head>
<body>
<div id="wheel-app"></div>

<script>
(function () {
  const PALETTE = ["#E8B86D", "#6B7A97", "#C97B63", "#8FA998", "#D4A5C9", "#7E9CD8", "#B7A16C", "#7FB0A6"];
  const EFFECT_COLORS = PALETTE.concat(["#FFFFFF", "#E8B86D"]);
  const STORAGE_KEY = "formwheel-entries";
  const SETTINGS_KEY = "formwheel-settings";
  const USERS_KEY = "formwheel-users";
  const SESSION_KEY = "formwheel-session";
  const PRESETS_KEY = "formwheel-presets";
  const HISTORY_KEY = "formwheel-history";
  const SHARE_PREFIX = "formwheel-share-";
  const DEFAULT_SETTINGS = {

  const hasArtifactStorage = typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";

  async function storageGet(key, shared) {
    if (hasArtifactStorage) {
      try {
        return await window.storage.get(key, !!shared);
      } catch (e) {
        return null;
      }
    }
    try {
      const raw = localStorage.getItem((shared ? "shared:" : "") + key);
      return raw ? { value: raw } : null;
    } catch (e) {
      return null;
    }
  }

  async function storageSet(key, value, shared) {
    if (hasArtifactStorage) {
      try {
        return await window.storage.set(key, value, !!shared);
      } catch (e) {
        return null;
      }
    }
    try {
      localStorage.setItem((shared ? "shared:" : "") + key, value);
      return true;
    } catch (e) {
      return null;
    }
  }

  function clamp(v, min, max) {
    if (Number.isNaN(v)) return min;
    return Math.min(max, Math.max(min, v));
  }

  async function hashPassword(pw) {
    const enc = new TextEncoder().encode("formwheel-salt-v1:" + pw);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  }

  async function submitSignup() {
    authForm.error = "";
    const email = authForm.email.trim().toLowerCase();
    const pw = authForm.password;
    const confirmPw = authForm.confirm;
    if (!EMAIL_RE.test(email)) { authForm.error = t("errInvalidEmail"); render(); return; }
    if (pw.length < 6) { authForm.error = t("errPasswordShort"); render(); return; }
    if (pw !== confirmPw) { authForm.error = t("errPasswordMismatch"); render(); return; }
    if (!authForm.notRobot) { authForm.error = t("errNotRobot"); render(); return; }
    if (users.find((u) => u.email === email && u.verified)) { authForm.error = t("errEmailExists"); render(); return; }

    authBusy = true;
    render();
    const passHash = await hashPassword(pw);
    users = users.filter((u) => u.email !== email);
    users.push({ id: uid(), email, passHash, verified: true });
    await saveUsers();
    authBusy = false;
    currentUser = { email };
    await saveSession();
    authView = null;
    resetAuthForm();
    render();
  }

  async function submitLogin() {
    authForm.error = "";
    const email = authForm.email.trim().toLowerCase();
    const pw = authForm.password;
    const user = users.find((u) => u.email === email && u.verified);
    if (!user) { authForm.error = t("errEmailNotFound"); render(); return; }
    authBusy = true;
    render();
    const passHash = await hashPassword(pw);
    authBusy = false;
    if (passHash !== user.passHash) { authForm.error = t("errWrongPassword"); render(); return; }
    currentUser = { email };
    await saveSession();
    authView = null;
    resetAuthForm();
    render();
  }

  function fallbackCopy(text) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      return true;
    } catch (e) {
      return false;
    }
  }

  async function copyTextToClipboard(text) {
    let ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch (e) {
      ok = false;
    }
    if (!ok) ok = fallbackCopy(text);
    return ok;
  }

    const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;

  function updateBackgroundImage(file) {
    if (!currentUser || spinning || !file) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      const img = new Image();
      img.onload = function () {
        const maxW = 1600;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        settings.backgroundImage = canvas.toDataURL("image/jpeg", 0.82);
        saveSettings();
        render();
      };
      img.onerror = function () { /* ì´ë¯¸ì§ë¥¼ ì½ì§ ëª»íë©´ ì¡°ì©í ë¬´ì */ };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // í­ëª©ë³ weight(í¬ê¸°)ë¥¼ ë°ìí´ ë¶ì±ê¼´ ê°ëë¥¼ ê³ì°. ììë list ë°°ì´ ììì ëì¼.
  function computeSlices(list) {
    const total = list.reduce((s, e) => s + (e.weight || 1), 0) || 1;
    let acc = 0;
    return list.map((e) => {
      const w = e.weight || 1;
      const sliceAngle = (w / total) * 360;
      const start = acc;
      const end = acc + sliceAngle;
      acc = end;
      return { entry: e, start, end, mid: (start + end) / 2, sliceAngle };
    });
  }

  // ---------- í¨ê³¼ì (Web Audio API) ----------
  let audioCtx = null;
  let soundStopFns = [];

  function getAudioCtx() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {
        audioCtx = null;
      }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  function playTone(freq, startAt, dur, type, gainPeak) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + startAt;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainPeak != null ? gainPeak : 0.18, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function playNoiseBurst(startAt, dur, gainPeak) {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    const t0 = ctx.currentTime + startAt;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainPeak != null ? gainPeak : 0.12, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(gain).connect(ctx.destination);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }

  function playTickSpin(totalDuration) {
    const ctx = getAudioCtx();
    if (!ctx) return () => {};
    let cancelled = false;
    let t = 0.05;
    let interval = 0.06;
    const grow = 1.045;
    while (t < totalDuration - 0.1) {
      playTone(1500, t, 0.035, "square", 0.08);
      t += interval;
      interval *= grow;
    }
    return () => { cancelled = true; };
  }

  function playDrumrollSpin(totalDuration) {
    const ctx = getAudioCtx();
    if (!ctx) return () => {};
    let t = 0.05;
    const interval = 0.075;
    while (t < totalDuration - 0.15) {
      playNoiseBurst(t, 0.09, 0.10);
      t += interval;
    }
    playNoiseBurst(totalDuration - 0.05, 0.6, 0.22);
    playTone(1800, totalDuration - 0.05, 0.5, "sawtooth", 0.08);
    return () => {};
  }

  function spin() {
    const list = activeEntries();
    if (spinning || list.length === 0) return;
    spinning = true;

    const spinBtn = document.getElementById("wa-spin-btn");
    if (spinBtn) { spinBtn.disabled = true; spinBtn.textContent = t("spinning"); }
    const winnerBox = document.querySelector(".wa-winner");
    if (winnerBox) winnerBox.innerHTML = "";

    setInputsDisabled(true);

    const n = list.length;
    const slices = computeSlices(list);
    const totalWeight = list.reduce((s, e) => s + (e.weight || 1), 0) || 1;

    let r = Math.random() * totalWeight;
    let winnerIndex = n - 1;
    let acc = 0;
    for (let i = 0; i < n; i++) {
      acc += list[i].weight || 1;
      if (r < acc) { winnerIndex = i; break; }
    }

    const slice = slices[winnerIndex];
    const jitter = (Math.random() - 0.5) * slice.sliceAngle * 0.6;
    const centerAngle = slice.mid + jitter;
    const fullSpins = settings.rounds + Math.floor(Math.random() * 2);
    const targetMod = (360 - centerAngle + 360) % 360;
    const nextRotation = currentRotation - (currentRotation % 360) + fullSpins * 360 + targetMod;

    playSpinSound(settings.soundEffect, settings.duration);

    const wheelEl = document.getElementById("wa-wheel-el");
    wheelEl.style.transition = "transform " + settings.duration + "s cubic-bezier(0.16, 1, 0.3, 1)";
    void wheelEl.offsetWidth;
    wheelEl.style.transform = "rotate(" + nextRotation + "deg)";
    currentRotation = nextRotation;

    setTimeout(() => {
      spinning = false;
      lastWinner = list[winnerIndex];
      winnerModalOpen = true;
      playWinSound(settings.soundEffect);
      pushHistory(lastWinner);
      render();
    }, settings.duration * 1000 + 100);

        const points = [{ x, y }];
        const segments = 8 + Math.floor(Math.random() * 5);
        for (let i = 0; i < segments; i++) {
          x += (Math.random() - 0.5) * 70;
          y += canvas.height / segments;
          points.push({ x, y });
        }
        bolts.push({ points, life: 1 });
        flashAlpha = 0.55;
      }

      function frame(now) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (now >= nextBoltAt && now - startTime < duration - 300) {
          spawnBolt();
          nextBoltAt = now + 450 + Math.random() * 650;
        }
        if (flashAlpha > 0) {
          ctx.fillStyle = "rgba(225,230,255," + flashAlpha.toFixed(2) + ")";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          flashAlpha -= 0.05;
        }
        bolts.forEach((b) => { b.life -= 0.12; });
        bolts = bolts.filter((b) => b.life > 0);
        bolts.forEach((b) => {
          ctx.globalAlpha = Math.max(b.life, 0);
          ctx.strokeStyle = lightningColor;
          ctx.lineWidth = 2.4;
          ctx.shadowColor = lightningColor;
          ctx.shadowBlur = 10;
          ctx.beginPath();
          b.points.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
          ctx.stroke();
          ctx.shadowBlur = 0;
        });
        ctx.globalAlpha = 1;
        if (now - startTime < duration || bolts.length > 0) {
          rafId = requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      rafId = requestAnimationFrame(frame);
    } else if (settings.effect === "matrix") {
      const matrixColor = settings.matrixColor || DEFAULT_SETTINGS.matrixColor;
      const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const fontSize = 16;
      const cols = Math.max(1, Math.floor(canvas.width / fontSize));
      const drops = new Array(cols).fill(0).map(() => Math.random() * (canvas.height / fontSize));
      function frame(now) {
        ctx.fillStyle = "rgba(6,10,8,0.16)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + "px 'Courier New', monospace";
        ctx.fillStyle = matrixColor;
        for (let i = 0; i < cols; i++) {
          const ch = chars[Math.floor(Math.random() * chars.length)];
          const x = i * fontSize;
          const y = drops[i] * fontSize;
          ctx.fillText(ch, x, y);
          if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
          drops[i]++;
        }
        if (now - startTime < duration) {
          rafId = requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      rafId = requestAnimationFrame(frame);
    }

    effectCleanup = () => {
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener("resize", resize);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
  }

  function stopEffect() {
    if (effectCleanup) {
      effectCleanup();
      effectCleanup = null;
    }
    effectStarted = false;

  // ë¤ê°í ëª¨ì ì ì: ì nê°íì ë³ ìì íì ê°(ììª½ ê¼­ì§ì  ê¸°ì¤)
  const POLY_SHAPES = {
    square: { sides: 4, rotation: 45 },
    triangle: { sides: 3, rotation: 0 },
    diamond: { sides: 4, rotation: 0 },
    pentagon: { sides: 5, rotation: 0 },
    hexagon: { sides: 6, rotation: 0 },
  };

  function polygonPointsSvg(cx, cy, r, shape) {
    const def = POLY_SHAPES[shape] || POLY_SHAPES.square;
    const pts = [];
    for (let i = 0; i < def.sides; i++) {
      const angle = (def.rotation + (i * 360) / def.sides - 90) * Math.PI / 180;
      pts.push((cx + r * Math.cos(angle)).toFixed(2) + "," + (cy + r * Math.sin(angle)).toFixed(2));
    }
    return pts.join(" ");
  }

  // ëë¦¼í ë°ê¹¥ íëë¦¬ì© CSS clip-path (í¼ì¼í¸ ì¢íê³, ì¤ì¬ 50% ë°ì§ë¦ 50%)
  function polygonClipPathCss(shape) {
    const def = POLY_SHAPES[shape] || POLY_SHAPES.square;
    const pts = [];
    for (let i = 0; i < def.sides; i++) {
      const angle = (def.rotation + (i * 360) / def.sides - 90) * Math.PI / 180;
      const x = (50 + 50 * Math.cos(angle)).toFixed(2);
      const y = (50 + 50 * Math.sin(angle)).toFixed(2);
      pts.push(x + "% " + y + "%");
    }
    return "polygon(" + pts.join(", ") + ")";
  }

  function wheelShapeStyle(shape) {
    if (shape === "square") return { borderRadius: "18px", clipPath: "none" };
    if (shape && POLY_SHAPES[shape]) {
      const cp = polygonClipPathCss(shape);
      return { borderRadius: "0", clipPath: cp, webkitClipPath: cp };
    }
    return { borderRadius: "50%", clipPath: "none", webkitClipPath: "none" };
  }

  // ì¤ì ì ì¤íì¼: ë¨ì / ë ì¸ë³´ì°(ë¶ì±ê¼´ë¡ ë¬´ì§ê° ê·¼ì¬) / ì¬ì§(ëª¨ìëë¡ í´ë¦½) / ìì
  // + ëª¨ì: ì / ì¬ê°í / ì¼ê°í / ë¤ì´ìëª¬ë / ì¤ê°í / ì¡ê°í (ë¡ê·¸ì¸ íì)
  function buildHubMarkup(cx, cy, r) {
    const type = settings.hubType || "color";
    if (type === "none") return "";
    const shape = settings.hubShape || "circle";
    const isCircle = shape === "circle" || !POLY_SHAPES[shape];
    const shapeTag = isCircle
      ? '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"'
      : '<polygon points="' + polygonPointsSvg(cx, cy, r, shape) + '"';
    const outline = shapeTag + ' fill="none" stroke="#242338" stroke-width="4"/>';

    if (type === "image" && settings.hubImage) {
      return (
        '<defs><clipPath id="wa-hub-clip">' + shapeTag + '/></clipPath></defs>' +
        '<image href="' + settings.hubImage + '" x="' + (cx - r) + '" y="' + (cy - r) + '" width="' + (r * 2) + '" height="' + (r * 2) + '" clip-path="url(#wa-hub-clip)" preserveAspectRatio="xMidYMid slice"/>' +
        outline
      );
    }
    if (type === "rainbow") {
      const segs = 24;
      let arcs = "";
      for (let i = 0; i < segs; i++) {
        const a1 = (i / segs) * 360;
        const a2 = ((i + 1) / segs) * 360;
        const a1r = (a1 - 90) * Math.PI / 180;
        const a2r = (a2 - 90) * Math.PI / 180;
        const x1 = (cx + r * Math.cos(a1r)).toFixed(2);
        const y1 = (cy + r * Math.sin(a1r)).toFixed(2);
        const x2 = (cx + r * Math.cos(a2r)).toFixed(2);
        const y2 = (cy + r * Math.sin(a2r)).toFixed(2);
        const hue = Math.round((i / segs) * 360);
        arcs += '<path d="M ' + cx + ',' + cy + ' L ' + x1 + ',' + y1 + ' A ' + r + ',' + r + ' 0 0 1 ' + x2 + ',' + y2 + ' Z" fill="hsl(' + hue + ',85%,60%)"/>';
      }
      return (
        '<defs><clipPath id="wa-hub-clip">' + shapeTag + '/></clipPath></defs>' +
        '<g clip-path="url(#wa-hub-clip)">' + arcs + '</g>' +
        outline
      );
    }
    // ê¸°ë³¸: ë¨ì
    return shapeTag + ' fill="' + (settings.hubColor || DEFAULT_SETTINGS.hubColor) + '" stroke="#242338" stroke-width="4"/>';
  }

  function buildWheelSvg(list) {
    const cx = 160, cy = 160, r = 150, textR = 100;
    const n = list.length;
    if (n === 0) {
      return '<svg viewBox="0 0 320 320" width="100%" height="100%"><circle cx="160" cy="160" r="150" fill="#2D2B47"/></svg>';
    }
    let shapes = "";
    let labels = "";
    const textColor = settings.sliceTextColor || DEFAULT_SETTINGS.sliceTextColor;
    const borderColor = settings.sliceBorderColor || DEFAULT_SETTINGS.sliceBorderColor;

    if (n === 1) {
      const color = list[0].color || PALETTE[0];
      shapes = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + color + '" stroke="' + borderColor + '" stroke-width="1"/>';
      if (list[0].image) {
        const clipId = "wa-slice-clip-" + list[0].id;
        shapes +=
          '<defs><clipPath id="' + clipId + '"><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"/></clipPath></defs>' +
          '<image href="' + list[0].image + '" x="' + (cx - r) + '" y="' + (cy - r) + '" width="' + (r * 2) + '" height="' + (r * 2) + '" clip-path="url(#' + clipId + ')" preserveAspectRatio="xMidYMid slice"/>' +
          '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + borderColor + '" stroke-width="1"/>';
      }
      const label = escapeHtml(truncate(list[0].label, 16));
      const labelAttrs = list[0].image
        ? 'stroke="#FFFFFF" stroke-width="3" paint-order="stroke" fill="' + textColor + '"'
        : 'fill="' + textColor + '"';
      labels =
        '<text x="' + cx + '" y="' + (cy - textR) + '" transform="rotate(0 ' + cx + ' ' + cy + ')" ' +
        'text-anchor="middle" font-size="12" font-weight="600" ' + labelAttrs + '>' + label + '</text>';
    } else {
      const slices = computeSlices(list);
      slices.forEach((slice, i) => {
        const a1 = slice.start;
        const a2 = slice.end;
        const a1r = (a1 - 90) * Math.PI / 180;
        const a2r = (a2 - 90) * Math.PI / 180;
        const x1 = (cx + r * Math.cos(a1r)).toFixed(2);
        const y1 = (cy + r * Math.sin(a1r)).toFixed(2);
        const x2 = (cx + r * Math.cos(a2r)).toFixed(2);
        const y2 = (cy + r * Math.sin(a2r)).toFixed(2);
        const largeArc = (a2 - a1) > 180 ? 1 : 0;
        const color = slice.entry.color || PALETTE[i % PALETTE.length];
        const pathD =
          'M ' + cx + ',' + cy + ' L ' + x1 + ',' + y1 +
          ' A ' + r + ',' + r + ' 0 ' + largeArc + ' 1 ' + x2 + ',' + y2 + ' Z';
        shapes += '<path d="' + pathD + '" fill="' + color + '" stroke="' + borderColor + '" stroke-width="1"/>';
        if (slice.entry.image) {
          const clipId = "wa-slice-clip-" + slice.entry.id;
          shapes +=
            '<defs><clipPath id="' + clipId + '"><path d="' + pathD + '"/></clipPath></defs>' +
            '<image href="' + slice.entry.image + '" x="' + (cx - r) + '" y="' + (cy - r) + '" width="' + (r * 2) + '" height="' + (r * 2) + '" clip-path="url(#' + clipId + ')" preserveAspectRatio="xMidYMid slice"/>' +
            '<path d="' + pathD + '" fill="none" stroke="' + borderColor + '" stroke-width="1"/>';
        }

        const label = escapeHtml(truncate(slice.entry.label, 16));
        const labelAttrs = slice.entry.image
          ? 'stroke="#FFFFFF" stroke-width="3" paint-order="stroke" fill="' + textColor + '"'
          : 'fill="' + textColor + '"';
        labels +=
          '<text x="' + cx + '" y="' + (cy - textR) + '" transform="rotate(' + slice.mid + ' ' + cx + ' ' + cy + ')" ' +
          'text-anchor="middle" font-size="12" font-weight="600" ' + labelAttrs + '>' + label + '</text>';
      });
    }

    const hub = buildHubMarkup(cx, cy, 11);

    return '<svg viewBox="0 0 320 320" width="100%" height="100%">' + shapes + labels + hub + '</svg>';
  }

  function parseInputToLabels(text) {
    const bracketMatches = [...text.matchAll(/\[([^\[\]]*)\]/g)]
      .map((m) => m[1].trim())
      .filter((s) => s.length > 0);
    if (bracketMatches.length > 0) return bracketMatches;
    return text
      .split("\n")
      .map((l) => l.trim())
      .filter((l) => l.length > 0);
  }

  // "ì´ì©ê³ -5"ì²ë¼ "-" ë¤ê° ì«ìë§ ìì¼ë©´ ê·¸ ì«ìë¥¼ ì´ê¸° ê°ì¤ì¹(1~10)ë¡ ì°ê³ ,
  // "ì´ì©ê³ -ì ì©ê³ "ì²ë¼ ì«ìê° ìëë©´ ê¸°ì¡´ì²ë¼ note(ë¹ì²¨ í íë¨ì íì)ë¡ ì´ë¤.
  function parseEntryFromRaw(raw) {
    const idx = raw.indexOf("-");
    if (idx === -1) return { label: raw, note: null, weight: 1 };
    const label = raw.slice(0, idx).trim() || raw;
    const rest = raw.slice(idx + 1).trim();
    if (/^\d+$/.test(rest)) {
      const w = clamp(parseInt(rest, 10), WEIGHT_MIN, WEIGHT_MAX);
      return { label, note: null, weight: w };
    }
    return { label, note: rest || null, weight: 1 };
  }

    const borderColorInput = document.getElementById("wa-border-color-input");
    if (borderColorInput) borderColorInput.addEventListener("change", (ev) => updateWheelBorderColor(ev.target.value));

    const borderWidthInput = document.getElementById("wa-border-width-input");
    if (borderWidthInput) borderWidthInput.addEventListener("change", (ev) => updateWheelBorderWidth(ev.target.value));

    const sliceTextColorInput = document.getElementById("wa-slice-text-color-input");
    if (sliceTextColorInput) sliceTextColorInput.addEventListener("change", (ev) => updateSliceTextColor(ev.target.value));

    const sliceBorderColorInput = document.getElementById("wa-slice-border-color-input");
    if (sliceBorderColorInput) sliceBorderColorInput.addEventListener("change", (ev) => updateSliceBorderColor(ev.target.value));

    const hubInput = document.getElementById("wa-hub-input");
    if (hubInput) hubInput.addEventListener("change", (ev) => updateHubColor(ev.target.value));

    const hubTypeSelect = document.getElementById("wa-hub-type-select");
    if (hubTypeSelect) hubTypeSelect.addEventListener("change", (ev) => updateHubType(ev.target.value));

    const hubImageInput = document.getElementById("wa-hub-image-input");
    if (hubImageInput) {
      hubImageInput.addEventListener("change", (ev) => {
        const file = ev.target.files && ev.target.files[0];
        if (file) updateHubImage(file);
      });
    }

    const hubImageRemoveBtn = document.getElementById("wa-hub-image-remove");
    if (hubImageRemoveBtn) hubImageRemoveBtn.addEventListener("click", removeHubImage);

    const hubShapeSelect = document.getElementById("wa-hub-shape-select");
    if (hubShapeSelect) hubShapeSelect.addEventListener("change", (ev) => updateHubShape(ev.target.value));

    const wheelShapeSelect = document.getElementById("wa-wheel-shape-select");
    if (wheelShapeSelect) wheelShapeSelect.addEventListener("change", (ev) => updateWheelShape(ev.target.value));

    const presetNameInput = document.getElementById("wa-preset-name-input");
    if (presetNameInput) presetNameInput.addEventListener("input", (ev) => { presetNameInputValue = ev.target.value; });
    const presetSaveBtn = document.getElementById("wa-preset-save-btn");
    if (presetSaveBtn) presetSaveBtn.addEventListener("click", saveCurrentPreset);
    userPresets.forEach((p) => {
      const loadBtn = document.getElementById("wa-preset-load-" + p.id);
      const delBtn = document.getElementById("wa-preset-del-" + p.id);
      if (loadBtn) loadBtn.addEventListener("click", () => loadPreset(p.id));
      if (delBtn) delBtn.addEventListener("click", () => deletePreset(p.id));
    });

    entries.forEach((e) => {
      const delBtn = document.getElementById("wa-del-" + e.id);
      const editBtn = document.getElementById("wa-edit-" + e.id);
      const weightInput = document.getElementById("wa-weight-" + e.id);
      const colorInput = document.getElementById("wa-color-" + e.id);
      const hideInput = document.getElementById("wa-hide-" + e.id);
      if (delBtn) delBtn.addEventListener("click", () => deleteEntry(e.id));
      if (editBtn) editBtn.addEventListener("click", () => { editingId = e.id; render(); });
      if (weightInput) weightInput.addEventListener("change", (ev) => updateWeight(e.id, ev.target.value));
      if (colorInput) colorInput.addEventListener("change", (ev) => updateEntryColor(e.id, ev.target.value));
      if (hideInput) hideInput.addEventListener("change", () => toggleEntryHidden(e.id));

      const imageInput = document.getElementById("wa-entry-image-input-" + e.id);
      const imageBtn = document.getElementById("wa-entry-image-btn-" + e.id);
      const imageThumb = document.getElementById("wa-entry-image-thumb-" + e.id);
      const imageRemoveBtn = document.getElementById("wa-entry-image-remove-" + e.id);
      if (imageInput) {
        imageInput.addEventListener("change", (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (file) updateEntryImage(e.id, file);
        });
      }
      const openImagePicker = () => { if (currentUser && !spinning && imageInput) imageInput.click(); };
      if (imageBtn) imageBtn.addEventListener("click", openImagePicker);
      if (imageThumb) imageThumb.addEventListener("click", openImagePicker);
      if (imageRemoveBtn) imageRemoveBtn.addEventListener("click", () => removeEntryImage(e.id));
    });

    if (editingId) {
      const saveBtn = document.getElementById("wa-save-edit");
      const cancelBtn = document.getElementById("wa-cancel-edit");
      if (saveBtn) {
        saveBtn.addEventListener("click", () => {
          const label = document.getElementById("wa-edit-label").value;
          updateEntry(editingId, label);
        });
      }
      if (cancelBtn) cancelBtn.addEventListener("click", () => { editingId = null; render(); });
    }

    // ë¹ì²¨ íì
    if (winnerModalOpen && lastWinner) {
      const overlay = document.getElementById("wa-winner-overlay");
      const closeBtn = document.getElementById("wa-winner-close");
      const deleteBtn = document.getElementById("wa-winner-delete");
      if (closeBtn) closeBtn.addEventListener("click", closeWinnerModal);
      if (deleteBtn) deleteBtn.addEventListener("click", deleteWinnerEntry);
      if (overlay) overlay.addEventListener("click", (ev) => { if (ev.target === overlay) closeWinnerModal(); });
      if (!effectStarted) {
        effectStarted = true;
        startEffect();
      }
    } else {
      effectStarted = false;
    }

    // ì ì²´ ì­ì  íì¸ íì
    if (confirmClearOpen) {
      const cOverlay = document.getElementById("wa-confirm-overlay");
      const okBtn = document.getElementById("wa-confirm-ok");
      const cancelBtn2 = document.getElementById("wa-confirm-cancel");
      if (okBtn) okBtn.addEventListener("click", confirmClearAll);
      if (cancelBtn2) cancelBtn2.addEventListener("click", cancelClearAll);
      if (cOverlay) cOverlay.addEventListener("click", (ev) => { if (ev.target === cOverlay) cancelClearAll(); });
    }

    // ë¡ê·¸ì¸/íìê°ì/ì¸ì¦ íì
    const openLoginBtn = document.getElementById("wa-open-login");
    if (openLoginBtn) openLoginBtn.addEventListener("click", () => { authView = "login"; resetAuthForm(); render(); });
    const openSignupBtn = document.getElementById("wa-open-signup");
    if (openSignupBtn) openSignupBtn.addEventListener("click", () => { authView = "signup"; resetAuthForm(); render(); });
    const logoutBtn = document.getElementById("wa-logout-btn");
    if (logoutBtn) logoutBtn.addEventListener("click", logout);

    if (authView) {
      const overlay = document.getElementById("wa-auth-overlay");
      const cancelBtn = document.getElementById("wa-auth-cancel");
      const submitBtn = document.getElementById("wa-auth-submit");
      const gotoSignup = document.getElementById("wa-auth-goto-signup");
      const gotoLogin = document.getElementById("wa-auth-goto-login");
      const emailInput = document.getElementById("wa-auth-email");
      const pwInput = document.getElementById("wa-auth-password");
      const confirmInput = document.getElementById("wa-auth-confirm");
      const notRobotInput = document.getElementById("wa-auth-notrobot");

      if (emailInput) emailInput.addEventListener("input", (ev) => { authForm.email = ev.target.value; });
      if (pwInput) pwInput.addEventListener("input", (ev) => { authForm.password = ev.target.value; });
      if (confirmInput) confirmInput.addEventListener("input", (ev) => { authForm.confirm = ev.target.value; });
      if (notRobotInput) notRobotInput.addEventListener("change", (ev) => { authForm.notRobot = ev.target.checked; });

      if (cancelBtn) cancelBtn.addEventListener("click", () => { authView = null; resetAuthForm(); render(); });
      if (overlay) overlay.addEventListener("click", (ev) => { if (ev.target === overlay) { authView = null; resetAuthForm(); render(); } });
      if (gotoSignup) gotoSignup.addEventListener("click", () => { authView = "signup"; authForm.error = ""; render(); });
      if (gotoLogin) gotoLogin.addEventListener("click", () => { authView = "login"; authForm.error = ""; render(); });
      if (submitBtn) {
        submitBtn.addEventListener("click", () => {
          if (authView === "login") submitLogin();
          else if (authView === "signup") submitSignup();
        });
      }
    }
  }

  function optionHtml(value, current, label) {
    return '<option value="' + value + '" ' + (value === current ? "selected" : "") + '>' + label + '</option>';
  }

  function buildNotesFooter() {
    if (!lastWinner || !lastWinner.note || winnerModalOpen) return "";
    return '<div class="wa-footer-notes">' + escapeHtml(lastWinner.note) + "</div>";
  }

  function formatHistoryTime(ts) {
    try {
      const d = new Date(ts);
      const pad = (x) => String(x).padStart(2, "0");
      return pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
    } catch (e) {
      return "";
    }
  }

  function historyRowHtml(hEntry) {
    return (
      '<div class="wa-entry">' +
        '<span class="wa-entry-text">' + escapeHtml(hEntry.label) + '</span>' +
        '<span style="font-size:11px;color:var(--muted);flex:none;">' + formatHistoryTime(hEntry.ts) + '</span>' +
      '</div>'
    );
  }

  function winnerModalHtml() {
    const popupFontFamily = POPUP_FONTS[settings.popupFont] || POPUP_FONTS.default;
    let cardStyle = "";
    if (settings.popupStyle === "neon") {
      const neonColor = settings.neonColor || DEFAULT_SETTINGS.neonColor;
      const rgb = hexToRgb(neonColor);
      cardStyle = " style=\"--neon-c:" + neonColor + ";--neon-glow:rgba(" + rgb + ",0.5);\"";
    }
    return (
      '<div class="wa-modal-overlay" id="wa-winner-overlay">' +
        '<canvas class="wa-effect-canvas" id="wa-effect-canvas"></canvas>' +
        '<div class="wa-modal-card wa-modal-' + settings.popupStyle + '"' + cardStyle + '>' +
          '<div class="wa-modal-label">' + t("winnerLabel") + '</div>' +
          '<div class="wa-modal-text" style="font-family:' + popupFontFamily + ';">' + escapeHtml(lastWinner.label) + '</div>' +
          '<div class="wa-modal-actions">' +
            '<button class="wa-btn wa-btn-ghost" id="wa-winner-delete" style="flex:1;">' + t("deleteWinnerBtn") + '</button>' +
            '<button class="wa-btn wa-btn-primary" id="wa-winner-close" style="flex:1;">' + t("confirmBtn") + '</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function confirmModalHtml() {
    return (
      '<div class="wa-modal-overlay" id="wa-confirm-overlay">' +
        '<div class="wa-modal-card wa-modal-minimal wa-confirm-card">' +
          '<p class="wa-confirm-title">' + t("confirmClearTitle") + '</p>' +
          '<p class="wa-confirm-body">' + t("confirmClearBody") + '</p>' +
          '<div class="wa-confirm-actions">' +
            '<button class="wa-btn wa-btn-ghost" id="wa-confirm-cancel" style="flex:1;">' + t("cancelBtn") + '</button>' +
            '<button class="wa-btn wa-btn-primary" id="wa-confirm-ok" style="flex:1;">' + t("clearAll") + '</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function authModalHtml() {
    let body = "";
    if (authView === "login") {
      body =
        '<p class="wa-confirm-title">' + t("loginTitle") + '</p>' +
        (authForm.error ? '<p class="wa-auth-error">' + escapeHtml(authForm.error) + '</p>' : '') +
        '<div class="wa-auth-field"><label for="wa-auth-email">' + t("emailLabel") + '</label>' +
          '<input class="wa-input" id="wa-auth-email" type="email" value="' + escapeAttr(authForm.email) + '" ' + (authBusy ? "disabled" : "") + '></div>' +
        '<div class="wa-auth-field"><label for="wa-auth-password">' + t("passwordLabel") + '</label>' +
          '<input class="wa-input" id="wa-auth-password" type="password" value="' + escapeAttr(authForm.password) + '" ' + (authBusy ? "disabled" : "") + '></div>' +
        '<div class="wa-confirm-actions">' +
          '<button class="wa-btn wa-btn-ghost" id="wa-auth-cancel" style="flex:1;" ' + (authBusy ? "disabled" : "") + '>' + t("cancelBtn") + '</button>' +
          '<button class="wa-btn wa-btn-primary" id="wa-auth-submit" style="flex:1;" ' + (authBusy ? "disabled" : "") + '>' + t("loginSubmit") + '</button>' +
        '</div>' +
        '<p class="wa-auth-switch">' + t("noAccountText") + '<button id="wa-auth-goto-signup">' + t("signup") + '</button></p>';
    } else if (authView === "signup") {
      body =
        '<p class="wa-confirm-title">' + t("signupTitle") + '</p>' +
        (authForm.error ? '<p class="wa-auth-error">' + escapeHtml(authForm.error) + '</p>' : '') +
        '<div class="wa-auth-field"><label for="wa-auth-email">' + t("emailLabel") + '</label>' +
          '<input class="wa-input" id="wa-auth-email" type="email" value="' + escapeAttr(authForm.email) + '" ' + (authBusy ? "disabled" : "") + '></div>' +
        '<div class="wa-auth-field"><label for="wa-auth-password">' + t("passwordLabelSignup") + '</label>' +
          '<input class="wa-input" id="wa-auth-password" type="password" value="' + escapeAttr(authForm.password) + '" ' + (authBusy ? "disabled" : "") + '></div>' +
        '<div class="wa-auth-field"><label for="wa-auth-confirm">' + t("passwordConfirmLabel") + '</label>' +
          '<input class="wa-input" id="wa-auth-confirm" type="password" value="' + escapeAttr(authForm.confirm) + '" ' + (authBusy ? "disabled" : "") + '></div>' +
        '<div class="wa-captcha-row">' +
          '<input type="checkbox" id="wa-auth-notrobot" ' + (authForm.notRobot ? "checked" : "") + ' ' + (authBusy ? "disabled" : "") + '>' +
          '<label for="wa-auth-notrobot">' + t("notRobotLabel") + '</label>' +
        '</div>' +
        '<div class="wa-confirm-actions">' +
          '<button class="wa-btn wa-btn-ghost" id="wa-auth-cancel" style="flex:1;" ' + (authBusy ? "disabled" : "") + '>' + t("cancelBtn") + '</button>' +
          '<button class="wa-btn wa-btn-primary" id="wa-auth-submit" style="flex:1;" ' + (authBusy ? "disabled" : "") + '>' + t("signupSubmit") + '</button>' +
        '</div>' +
        '<p class="wa-auth-switch">' + t("haveAccountText") + '<button id="wa-auth-goto-login">' + t("login") + '</button></p>';
    }
    return (
      '<div class="wa-modal-overlay" id="wa-auth-overlay">' +
        '<div class="wa-modal-card wa-modal-minimal wa-confirm-card">' + body + '</div>' +
      '</div>'
    );
  }

  function renderForm() {
    const slot = document.getElementById("wa-form-slot");
    if (!slot) return;
    slot.innerHTML =
      '<div class="wa-form-row" style="flex-direction:column;">' +
        '<textarea class="wa-input" id="wa-new-input" rows="2" placeholder="' + escapeAttr(t("newInputPlaceholder")) + '" style="resize:vertical;" ' + (spinning ? "disabled" : "") + '></textarea>' +
      '</div>' +
      '<div class="wa-form-row">' +
        '<button class="wa-btn wa-btn-primary" id="wa-add-btn" style="width:100%;" ' + (spinning ? "disabled" : "") + '>' + t("addBtn") + '</button>' +
      '</div>' +
      '<p class="wa-hint">' + t("addHint") + '</p>';

    const addBtn = document.getElementById("wa-add-btn");
    const box = document.getElementById("wa-new-input");

    function doAdd() {
      const labels = parseInputToLabels(box.value);
      if (labels.length === 0) return;
      labels.forEach((raw) => {
        const { label, note, weight } = parseEntryFromRaw(raw);
        entries.push({ id: uid(), label: label, note: note, weight: weight, hidden: false });
      });
      saveEntries();
      box.value = "";
      render();
    }

    addBtn.addEventListener("click", doAdd);
    box.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) doAdd();
    });
  }

  function entryRowHtml(e, i) {
    if (editingId === e.id) {
      return (
        '<div class="wa-entry" style="flex-direction:column;align-items:stretch;gap:6px;">' +
          '<input class="wa-input" id="wa-edit-label" value="' + escapeAttr(e.label) + '" />' +
          '<div style="display:flex;gap:6px;">' +
            '<button class="wa-btn wa-btn-primary" id="wa-save-edit" style="flex:1;">' + t("saveBtn") + '</button>' +
            '<button class="wa-btn wa-btn-ghost" id="wa-cancel-edit" style="flex:1;">' + t("cancelBtn") + '</button>' +
          '</div>' +
        '</div>'
      );
    }
    const color = e.color || PALETTE[i % PALETTE.length];
    const canDecorate = !!currentUser && !spinning;
    const imageControls = e.image
      ? '<img src="' + e.image + '" alt="" class="wa-entry-image-thumb" id="wa-entry-image-thumb-' + e.id + '" style="width:26px;height:26px;border-radius:6px;object-fit:cover;border:1px solid var(--card-border);flex:none;' + (canDecorate ? 'cursor:pointer;' : '') + '" title="' + escapeAttr(currentUser ? t("entryImageTitle") : t("entryImageTitleLocked")) + '">' +
        '<button class="wa-icon-btn" id="wa-entry-image-remove-' + e.id + '" ' + (!canDecorate ? "disabled" : "") + ' title="' + escapeAttr(t("entryImageRemoveTitle")) + '">â</button>'
      : '<button class="wa-icon-btn" id="wa-entry-image-btn-' + e.id + '" ' + (!canDecorate ? "disabled" : "") + ' title="' + escapeAttr(currentUser ? t("entryImageTitle") : t("entryImageTitleLocked")) + '">ð¼</button>';
    return (
      '<div class="wa-entry' + (e.hidden ? ' wa-entry-hidden' : '') + '">' +
        '<input type="checkbox" class="wa-hide-checkbox" id="wa-hide-' + e.id + '" ' + (e.hidden ? "" : "checked") + ' ' + (spinning ? "disabled" : "") + ' title="' + escapeAttr(t("hideCheckboxTitle")) + '">' +
        '<input type="color" class="wa-color-input" id="wa-color-' + e.id + '" value="' + color + '" ' + (!currentUser || spinning ? "disabled" : "") + ' title="' + (currentUser ? t("entryColorTitle") : t("entryColorTitleLocked")) + '">' +
        '<input type="file" accept="image/*" id="wa-entry-image-input-' + e.id + '" style="display:none;" ' + (!canDecorate ? "disabled" : "") + '>' +
        imageControls +
        '<span class="wa-entry-text">' + escapeHtml(e.label) + '</span>' +
        '<input type="number" class="wa-input wa-weight-input" id="wa-weight-' + e.id + '" min="' + WEIGHT_MIN + '" max="' + WEIGHT_MAX + '" step="1" value="' + (e.weight || 1) + '" title="' + escapeAttr(t("weightTitle")) + '" ' + (spinning ? "disabled" : "") + '>' +
        '<span class="wa-entry-actions">' +
          '<button class="wa-icon-btn" id="wa-edit-' + e.id + '" ' + (spinning ? "disabled" : "") + '>' + t("editBtn") + '</button>' +
          '<button class="wa-icon-btn" id="wa-del-' + e.id + '" ' + (spinning ? "disabled" : "") + '>' + t("deleteBtn") + '</button>' +
        '</span>' +
      '</div>'
    );
  }

  function presetRowHtml(p) {
    return (
      '<div class="wa-entry">' +
        '<span class="wa-entry-text">' + escapeHtml(p.name) + ' <span style="opacity:.55;font-weight:400;">' + t("presetCount")(p.entries.length) + '</span></span>' +
        '<span class="wa-entry-actions">' +
          '<button class="wa-icon-btn" id="wa-preset-load-' + p.id + '" ' + (spinning ? "disabled" : "") + '>' + t("loadBtn") + '</button>' +
          '<button class="wa-icon-btn" id="wa-preset-del-' + p.id + '" ' + (spinning ? "disabled" : "") + '>' + t("deleteBtn") + '</button>' +
        '</span>' +
      '</div>'
    );
  }

  function truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + "â¦" : s; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  async function init() {
    await loadSettings();
    await loadEntries();
    await loadUsers();
    await loadSession();
    await loadPresetsStore();
    await loadHistory();
    await tryLoadSharedWheelFromUrl();
    if (currentUser && !users.find((u) => u.email === currentUser.email && u.verified)) {
      currentUser = null;
    }
    render();
  }

  init();
})();

</script>
</body>
